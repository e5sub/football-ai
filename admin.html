<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理后台｜AI 足球赛事研判</title>
  <style>
    :root{--bg:#071019;--panel:#0d1824;--panel2:#111f2d;--line:#26394b;--text:#eff7ff;--muted:#94a8ba;--cyan:#41d4ff;--green:#37dfaa;--amber:#ffca63;--red:#ff7389;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 0 0,#12324b 0,transparent 31%),var(--bg);color:var(--text)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{width:min(1280px,100%);margin:auto;padding:22px}.topbar,.card,.stat{border:1px solid var(--line);background:rgba(13,24,36,.92);box-shadow:0 12px 40px rgba(0,0,0,.2)}.topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 16px;border-radius:14px}.brand{display:flex;gap:12px;align-items:center}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#1a6680,#1d3d57);color:var(--cyan);font-weight:900}.eyebrow{font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase}h1,h2,h3,p{margin:0}h1{font-size:18px;margin-top:3px}.sub,.hint{color:var(--muted);font-size:12px;line-height:1.55}.header-actions,.action-row,.filters,.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn,.field,select{border:1px solid var(--line);border-radius:8px;background:#0a141f;min-height:38px}.btn{padding:0 13px;color:var(--text)}.btn:hover{border-color:var(--cyan);background:#10293a}.btn.primary{border-color:#287a96;background:linear-gradient(135deg,#123f54,#123b38)}.btn.danger{border-color:#844052;color:#ffc0cc}.btn:disabled{opacity:.55;cursor:not-allowed}.main{display:grid;gap:16px;margin-top:18px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:end}.hero h2{margin-top:6px;font-size:28px}.stats{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:9px;min-width:min(460px,100%)}.stat{border-radius:12px;padding:13px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;margin-top:7px;font-size:25px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.8fr);gap:16px}.card{border-radius:14px;padding:16px}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}.card h3{font-size:16px}.tabs{border-bottom:1px solid var(--line);padding-bottom:12px}.tab{border:0;background:transparent;color:var(--muted);padding:7px 4px;border-bottom:2px solid transparent}.tab.active{color:var(--cyan);border-color:var(--cyan)}.field{width:100%;padding:0 10px;outline:0}.filters .field{max-width:260px}.list{display:grid;gap:8px;max-height:530px;overflow:auto;padding-right:3px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid #213445;border-radius:10px;background:rgba(255,255,255,.025)}.row b{display:block;font-size:13px;overflow-wrap:anywhere}.row small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.tag{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--muted)}.tag.ok{color:var(--green);border-color:#26765d}.tag.warn{color:var(--amber);border-color:#84662b}.tag.red{color:#ffafba;border-color:#884656}.row-right{display:grid;justify-items:end;gap:6px;text-align:right}.empty{padding:28px 8px;text-align:center;color:var(--muted);font-size:13px}.quick{display:grid;gap:12px}.update-status{padding:12px;border:1px solid #23445a;border-radius:10px;background:#0a1723}.update-status b{display:block;font-size:13px}.update-status small{display:block;margin-top:5px;white-space:pre-wrap;word-break:break-word;color:var(--muted);font-size:11px;line-height:1.55}.code-result{padding:13px;border:1px dashed #3986a1;border-radius:10px;background:#0b202d}.code-value{margin-top:7px;font:700 18px ui-monospace,monospace;letter-spacing:.07em;color:var(--green);word-break:break-all}.form{display:grid;gap:10px}.form label{display:grid;gap:6px;font-size:12px;color:#c6d5e2}.login{width:min(450px,100%);margin:12vh auto}.notice{min-height:20px;color:var(--amber);font-size:12px;line-height:1.55}.security{display:flex;justify-content:space-between;gap:12px;align-items:end}.mobile-only{display:none}@media(max-width:820px){.shell{padding:12px}.topbar,.hero,.security{align-items:stretch;flex-direction:column}.workspace{grid-template-columns:1fr}.stats{min-width:0}.header-actions .btn{flex:1}.filters .field{max-width:none;flex:1}.row{grid-template-columns:1fr}.row-right{justify-items:start;text-align:left}.mobile-only{display:inline}.hero h2{font-size:25px}}
    .admin-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;min-height:calc(100vh - 44px)}.admin-nav{position:sticky;top:22px;height:calc(100vh - 44px);padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(9,19,29,.94);box-shadow:0 12px 40px rgba(0,0,0,.2)}.admin-nav-title{display:flex;gap:10px;align-items:center;padding:8px 4px 22px;border-bottom:1px solid var(--line);font-weight:800}.admin-nav-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#153d52;color:var(--cyan);font-weight:900}.admin-nav-list{display:grid;gap:6px;margin-top:18px}.admin-nav-item{display:flex;gap:10px;align-items:center;width:100%;padding:11px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);text-align:left}.admin-nav-item.active,.admin-nav-item:hover{border-color:#287a96;background:#10293a;color:var(--text)}.admin-nav-foot{position:absolute;bottom:16px;left:16px;right:16px;color:var(--muted);font-size:11px;line-height:1.5}.admin-content{min-width:0}.admin-content>.topbar{border-radius:14px}.admin-content .main{margin-top:18px}@media(max-width:760px){.admin-layout{display:block}.admin-nav{position:static;height:auto;margin-bottom:12px}.admin-nav-list{display:flex;overflow:auto;margin-top:12px}.admin-nav-item{min-width:max-content}.admin-nav-foot{display:none}}
    .admin-view-hidden{display:none!important}
  </style>
</head>
<body>
  <main class="shell admin-layout">
    <aside class="admin-nav"><div class="admin-nav-title"><div class="admin-nav-mark">AI</div><div><div class="eyebrow">Control room</div><b>管理中心</b></div></div><nav class="admin-nav-list"><button class="admin-nav-item active" data-tab="users" type="button">▦ <span>用户管理</span></button><button class="admin-nav-item" data-tab="codes" type="button">⌁ <span>激活码</span></button><button class="admin-nav-item" data-nav="update" type="button">↻ <span>赛事更新</span></button><button class="admin-nav-item" data-nav="security" type="button">⚙ <span>安全设置</span></button></nav><div class="admin-nav-foot">AI Football<br>管理员工作台</div></aside>
    <div class="admin-content">
    <header class="topbar"><div class="brand"><div class="mark">AI</div><div><div class="eyebrow">Operations center</div><h1>管理后台</h1><p class="sub">赛事更新、用户授权与激活码</p></div></div><div class="header-actions"><button class="btn" id="refreshBtn" type="button">刷新数据</button><button class="btn" id="backBtn" type="button">返回首页</button></div></header>
    <section class="main">
      <div class="stats"><div class="stat"><span>用户</span><b id="userCount">--</b></div><div class="stat"><span>可用账号</span><b id="activeCount">--</b></div><div class="stat"><span>可兑换激活码</span><b id="codeCount">--</b></div></div>
      <form class="card login hidden" id="loginForm"><div class="card-head"><div><h3>管理员登录</h3><p class="hint">使用管理员账号验证后进入后台。</p></div></div><div class="form"><label>邮箱<input class="field" id="email" type="email" autocomplete="email" required></label><label>密码<input class="field" id="password" type="password" autocomplete="current-password" minlength="8" required></label><button class="btn primary" type="submit">登录并进入后台</button></div><p class="notice" id="loginMessage"></p></form>
      <div id="panel" class="hidden">
        <div class="workspace"><section class="card"><div class="card-head"><div><h3>用户与授权</h3><p class="hint">启用账号会授予持续访问权限；停用后该账号立即无法继续使用。</p></div></div><div class="tabs"><button class="tab active" data-tab="users" type="button">用户列表</button><button class="tab" data-tab="codes" type="button">激活码记录</button></div><div class="filters"><input class="field" id="search" type="search" placeholder="搜索邮箱、ID 或激活码尾号"></div><div class="list" id="list"></div></section>
          <aside class="quick"><section class="card"><div class="card-head"><div><h3>赛事数据</h3><p class="hint">更新在后台运行，可安全留在本页查看结果。</p></div></div><button class="btn primary" id="updateBtn" type="button">立即更新赛事数据</button><button class="btn" id="importBtn" type="button">从 JSON 导入数据库</button><div class="update-status" id="updateStatus"><b>尚未查询更新状态</b><small>点击更新后将显示抓取、数据库同步或失败原因。</small></div></section><section class="card"><div class="card-head"><div><h3>生成激活码</h3><p class="hint">激活码领取后仅显示一次，请及时复制。</p></div></div><div class="form"><label>授权期限<select id="duration"><option value="month">一个月</option><option value="half_year">半年</option><option value="year">一年</option><option value="permanent">永久</option></select></label><button class="btn primary" id="codeBtn" type="button">生成新激活码</button></div><div class="code-result hidden" id="codeResult"><div class="hint">新激活码</div><div class="code-value" id="codeValue"></div><div class="action-row" style="margin-top:10px"><button class="btn" id="copyCodeBtn" type="button">复制激活码</button></div></div></section></aside></div>
        <section class="card"><div class="security"><div><h3>安全设置</h3><p class="hint">重置密码会使所有管理员会话失效。</p></div><form class="action-row" id="passwordForm"><input class="field" id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="新的管理员密码" required><button class="btn" type="submit">重置密码</button><button class="btn danger" id="logoutBtn" type="button">退出登录</button></form></div><p class="notice" id="notice"></p></section>
      </div>
    </section>
    </div>
  </main>
  <script>
    const state={authToken:localStorage.getItem('football_ai_session')||'',adminToken:localStorage.getItem('football_ai_admin_session')||'',csrfToken:'',user:null,users:[],codes:[],tab:'users',updateTimer:null};
    const $=id=>document.getElementById(id),escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),formatDate=v=>v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'--';
    async function csrf(){const r=await fetch('/api/auth/csrf',{credentials:'same-origin'});state.csrfToken=(await r.json()).csrf_token||''}
    async function request(path,options={},token=''){const headers={'Content-Type':'application/json'};if(['POST','PATCH','DELETE'].includes(options.method))headers['X-CSRF-Token']=state.csrfToken;const call=t=>fetch('/api'+path,{...options,credentials:'same-origin',cache:'no-store',headers:{...headers,...(t?{Authorization:'Bearer '+t}:{})}});let r=await call(token||state.adminToken||state.authToken);if(!r.ok&&state.adminToken&&state.authToken&&[401,403].includes(r.status))r=await call(state.authToken);const data=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(data.detail||`请求失败（HTTP ${r.status}）`);e.status=r.status;throw e}return data}
    function setNotice(text=''){ $('notice').textContent=text }
    function render(){const query=$('search').value.trim().toLowerCase();const items=state.tab==='users'?state.users:state.codes;const matches=x=>!query||Object.values(x).some(v=>String(v??'').toLowerCase().includes(query));const filtered=items.filter(matches);$('list').innerHTML=filtered.length?filtered.map(state.tab==='users'?renderUser:renderCode).join(''):'<div class="empty">没有找到匹配记录</div>';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab))}
    function renderUser(u){const active=u.is_active;const access=u.is_admin?'管理员':active?'可用':'已停用';return `<article class="row"><div><b>${escapeHtml(u.email)}</b><small>ID ${u.id} · ${u.bet_count} 条执行记录 · 注册于 ${formatDate(u.created_at)}</small></div><div class="row-right"><span class="tag ${u.is_admin||active?'ok':'red'}">${access}</span>${u.is_admin?'':`<button class="btn" data-user="${u.id}" data-active="${!active}" type="button">${active?'停用账号':'启用账号'}</button>`}</div></article>`}
    function renderCode(c){const expired=new Date(c.expires_at)<new Date(),status=c.used_at?`已使用（用户 ${c.used_by}）`:expired?'已过期':'待兑换',cls=c.used_at?'':' '+(expired?'red':'ok');return `<article class="row"><div><b>${escapeHtml(c.code_hint)}</b><small>${escapeHtml(c.duration)}授权 · 兑换截止 ${formatDate(c.expires_at)} · 创建于 ${formatDate(c.created_at)}</small></div><div class="row-right"><span class="tag${cls}">${status}</span></div></article>`}
    async function load(){const [users,codes,status]=await Promise.all([request('/admin/users'),request('/admin/activation-codes'),request('/admin/update-data/status')]);state.users=users.items;state.codes=codes.items;$('userCount').textContent=users.items.length;$('activeCount').textContent=users.items.filter(x=>x.is_active).length;$('codeCount').textContent=codes.items.filter(x=>!x.used_at&&new Date(x.expires_at)>=new Date()).length;render();showUpdateStatus(status)}
    function showUpdateStatus(s){$('updateStatus').innerHTML=`<b>${escapeHtml(s.message||'暂无更新任务')}</b><small>${s.running?'更新任务正在后台运行，请耐心等待。':(s.output||'最近一次任务尚无详细输出')}</small>`;$('updateBtn').disabled=Boolean(s.running);if(s.running)watchUpdate()}
    function watchUpdate(){clearTimeout(state.updateTimer);state.updateTimer=setTimeout(async()=>{try{const s=await request('/admin/update-data/status');showUpdateStatus(s);if(!s.running)await load()}catch(e){setNotice(e.message)}},2500)}
    function showPanel(){const access=Boolean(state.adminToken||state.user?.is_admin);$('loginForm').classList.toggle('hidden',access);$('panel').classList.toggle('hidden',!access);if(access)load().catch(e=>setNotice(e.message))}
    async function init(){try{await csrf();if(state.authToken)state.user=await request('/auth/me',{},state.authToken);else if(state.adminToken)await request('/admin/users',{},state.adminToken);else throw Object.assign(new Error('请使用管理员账号登录'),{status:401});showPanel()}catch(e){if([401,403].includes(e.status)){localStorage.removeItem('football_ai_admin_session');state.adminToken=''}$('loginForm').classList.remove('hidden');$('panel').classList.add('hidden');$('loginMessage').textContent=e.message}}
    $('backBtn').onclick=()=>location.href='/';$('refreshBtn').onclick=()=>load().catch(e=>setNotice(e.message));$('search').oninput=render;document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;render()};$('list').onclick=async e=>{const b=e.target.closest('[data-user]');if(!b)return;const action=b.dataset.active==='true'?'启用':'停用';if(!confirm(`确定要${action}这个账号吗？`))return;try{await request(`/admin/users/${b.dataset.user}`,{method:'PATCH',body:JSON.stringify({is_active:b.dataset.active==='true'})});setNotice(`账号已${action}`);await load()}catch(err){setNotice(err.message)}};
    $('loginForm').onsubmit=async e=>{e.preventDefault();try{const p=await request('/admin/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});state.adminToken=p.token;state.authToken=p.user_token||state.authToken;state.user=p.user;localStorage.setItem('football_ai_admin_session',p.token);if(p.user_token)localStorage.setItem('football_ai_session',p.user_token);showPanel()}catch(err){$('loginMessage').textContent=err.message}};$('updateBtn').onclick=async()=>{try{const p=await request('/admin/update-data',{method:'POST',body:'{}'});setNotice(p.message);showUpdateStatus({running:true,message:p.message,output:''})}catch(e){setNotice(e.message)}};$('importBtn').onclick=async()=>{const button=$('importBtn');button.disabled=true;try{const p=await request('/admin/import-data',{method:'POST',body:'{}'});setNotice(`${p.message}：${Object.entries(p.results).map(([key,value])=>`${key}=${value}`).join('，')}`);await load()}catch(e){setNotice(e.message)}finally{button.disabled=false}};$('codeBtn').onclick=async()=>{try{const p=await request('/admin/activation-codes',{method:'POST',body:JSON.stringify({expires_hours:72,duration:$('duration').value})});$('codeValue').textContent=p.code;$('codeResult').classList.remove('hidden');setNotice('激活码已生成，请复制后妥善保存。');await load()}catch(e){setNotice(e.message)}};$('copyCodeBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('codeValue').textContent);setNotice('激活码已复制。')}catch(e){setNotice('复制失败，请手动复制激活码。')}};$('passwordForm').onsubmit=async e=>{e.preventDefault();try{const p=await request('/admin/password',{method:'POST',body:JSON.stringify({new_password:$('newPassword').value})});alert(p.message);logout()}catch(err){setNotice(err.message)}};async function logout(){clearTimeout(state.updateTimer);try{await request('/auth/logout',{method:'POST',body:'{}'})}catch(e){}localStorage.removeItem('football_ai_admin_session');localStorage.removeItem('football_ai_session');location.href='/'}$('logoutBtn').onclick=logout;init();
  </script>
  <script>
    const adminUserView=document.querySelector('.workspace > section.card'), adminQuickCards=[...document.querySelectorAll('.quick > section.card')], adminSecurityView=document.getElementById('passwordForm').closest('section.card');
    function setAdminView(view){adminUserView.classList.toggle('admin-view-hidden',view!=='users'&&view!=='codes');adminQuickCards.forEach((card,index)=>card.classList.toggle('admin-view-hidden',view===(index===0?'codes':'update')||view==='users'||view==='security'));adminSecurityView.classList.toggle('admin-view-hidden',view!=='security');document.querySelectorAll('.admin-nav-item').forEach(item=>item.classList.toggle('active',item.dataset.tab===view||item.dataset.nav===view));if(view==='codes'){state.tab='codes';render();}if(view==='users'){state.tab='users';render();}}
    document.querySelectorAll('.admin-nav-item[data-tab]').forEach(button=>button.addEventListener('click',()=>setAdminView(button.dataset.tab)));
    document.querySelector('[data-nav="update"]').addEventListener('click',()=>setAdminView('update'));
    document.querySelector('[data-nav="security"]').addEventListener('click',()=>setAdminView('security'));
    setAdminView('users');
  </script>
</body>
</html>
