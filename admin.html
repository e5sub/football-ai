<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>管理后台｜AI 足球赛事研判</title>
  <style>
    :root{--bg:#071019;--panel:#0d1824;--line:#26394b;--text:#eff7ff;--muted:#94a8ba;--cyan:#41d4ff;--green:#37dfaa;--amber:#ffca63;--red:#ff7389;font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 0 0,#12324b 0,transparent 31%),var(--bg);color:var(--text)}
    button,input,select{font:inherit;color:inherit}
    button{cursor:pointer;border:0;background:transparent}
    .hidden{display:none!important}
    .shell{width:min(1280px,100%);margin:auto;padding:22px}
    .admin-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;min-height:calc(100vh - 44px)}
    .admin-nav{position:sticky;top:22px;height:calc(100vh - 44px);padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(9,19,29,.94);box-shadow:0 12px 40px rgba(0,0,0,.2)}
    .admin-nav-title{display:flex;gap:10px;align-items:center;padding:8px 4px 22px;border-bottom:1px solid var(--line)}
    .admin-nav-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#153d52;color:var(--cyan);font-weight:900}
    .admin-nav-list{display:grid;gap:6px;margin-top:18px}
    .admin-nav-item{display:flex;gap:10px;align-items:center;width:100%;padding:11px 10px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted);text-align:left}
    .admin-nav-item.active,.admin-nav-item:hover{border-color:#287a96;background:#10293a;color:var(--text)}
    .admin-nav-foot{position:absolute;bottom:16px;left:16px;right:16px;color:var(--muted);font-size:11px;line-height:1.5}
    .admin-content{min-width:0}
    .topbar,.card,.stat{border:1px solid var(--line);background:rgba(13,24,36,.92);box-shadow:0 12px 40px rgba(0,0,0,.2)}
    .topbar{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 16px;border-radius:14px}
    .brand{display:flex;gap:12px;align-items:center}
    .mark{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#1a6680,#1d3d57);color:var(--cyan);font-weight:900}
    .eyebrow{font:700 11px/1.2 ui-monospace,monospace;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase}
    h1,h2,h3,p{margin:0}
    h1{font-size:18px;margin-top:3px}
    .sub,.hint{color:var(--muted);font-size:12px;line-height:1.55}
    .header-actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn,.field,select{border:1px solid var(--line);border-radius:8px;background:#0a141f;min-height:38px}
    .btn{padding:0 13px;color:var(--text);white-space:nowrap}
    .btn:hover{border-color:var(--cyan);background:#10293a}
    .btn.primary{border-color:#287a96;background:linear-gradient(135deg,#123f54,#123b38)}
    .btn.danger{border-color:#844052;color:#ffc0cc}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .field{width:100%;padding:0 11px;outline:0}
    .main{display:grid;gap:16px;margin-top:18px}
    .stats{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:10px}
    .stat{border-radius:12px;padding:14px;transition:transform .15s,box-shadow .15s}
    .stat:hover{transform:translateY(-2px);box-shadow:0 16px 44px rgba(0,0,0,.28)}
    .stat span{font-size:12px;color:var(--muted)}
    .stat b{display:block;margin-top:7px;font-size:25px}
    .notice{min-height:20px;color:var(--amber);font-size:12px;line-height:1.55;margin:0 2px}
    .workspace{display:grid;gap:16px}
    .card{border-radius:14px;padding:16px}
    .card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
    .card h3{font-size:16px}
    .filters{margin-bottom:12px}
    .filters .field{max-width:340px}
    .list{display:grid;gap:8px;max-height:560px;overflow:auto;padding-right:3px}
    .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border:1px solid #213445;border-radius:12px;background:linear-gradient(135deg,rgba(255,255,255,.03),rgba(255,255,255,.01));transition:border-color .15s,transform .15s}
    .row:hover{border-color:#2d556d;transform:translateY(-1px)}
    .row b{display:block;font-size:13px;overflow-wrap:anywhere}
    .row small{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.6}
    .row-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
    .row-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .tag{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);font-size:11px;font-weight:600}
    .tag.ok{color:var(--green);border-color:#26765d}
    .tag.warn{color:var(--amber);border-color:#84662b}
    .tag.red{color:#ffafba;border-color:#884656}
    .tag.used{color:#9aa8b8;border-color:#324354}
    .empty{padding:48px 16px;text-align:center;color:var(--muted)}
    .empty-ico{display:block;width:42px;height:42px;margin:0 auto 14px;opacity:.4}
    .empty b{display:block;color:#aab9c6;font-size:14px;font-weight:600}
    .empty small{display:block;margin-top:6px;font-size:12px}
    .code-gen{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid #287a96;border-radius:14px;background:linear-gradient(135deg,rgba(18,63,84,.42),rgba(18,59,56,.22));margin-bottom:16px}
    .code-gen-head{display:flex;align-items:center;gap:12px}
    .code-gen-mark{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#1a6680,#123f54);color:var(--cyan);font-size:20px;flex-shrink:0}
    .code-gen-head h3{font-size:15px;font-weight:700}
    .code-gen-head p{margin-top:3px}
    .form-label{font-size:12px;color:#c6d5e2}
    .duration-group{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .duration-opt{display:flex;flex-direction:column;gap:3px;padding:11px 6px;border:1px solid var(--line);border-radius:10px;background:#0a141f;color:var(--muted);cursor:pointer;transition:border-color .15s,background .15s,color .15s;text-align:center}
    .duration-opt:hover{border-color:#287a96;color:#c6d5e2;background:#10202e}
    .duration-opt.active{border-color:var(--cyan);background:linear-gradient(135deg,rgba(50,213,255,.16),rgba(55,223,170,.1));color:var(--text);box-shadow:inset 0 0 0 1px rgba(50,213,255,.25)}
    .duration-opt b{font-size:14px;font-weight:700}
    .duration-opt small{font-size:11px;opacity:.8}
    .code-gen-actions{display:flex;gap:8px}
    .code-gen-actions .btn.primary{flex:1;height:42px;font-size:14px;font-weight:700;letter-spacing:.04em}
    .code-result{padding:16px;border:1px dashed #3986a1;border-radius:12px;background:linear-gradient(135deg,rgba(11,32,45,.85),rgba(10,28,38,.6))}
    .code-result .hint{display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px;font-weight:600}
    .code-result .hint::before{content:"";display:inline-block;width:16px;height:16px;border-radius:50%;background:rgba(55,223,170,.18);border:1px solid var(--green)}
    .code-value{margin-top:11px;padding:15px 12px;border:1px solid #26765d;border-radius:10px;background:#081b18;font:700 22px ui-monospace,monospace;letter-spacing:.08em;color:var(--green);word-break:break-all;text-align:center}
    .code-row{grid-template-columns:auto minmax(0,1fr) auto}
    .code-row .code-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#153d52,#10283a);color:var(--cyan);font-size:18px;flex-shrink:0}
    .code-row .code-info b{font-family:ui-monospace,monospace;letter-spacing:.04em}
    .quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .update-status{padding:12px;border:1px solid #23445a;border-radius:10px;background:#0a1723}
    .update-status b{display:block;font-size:13px}
    .update-status small{display:block;margin-top:5px;white-space:pre-wrap;word-break:break-word;color:var(--muted);font-size:11px;line-height:1.55}
    .security-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .security-form .field{flex:1;min-width:200px}
    .modal-overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(3,8,14,.66)}
    .modal{width:min(460px,100%);border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.5);overflow:hidden}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
    .modal-head h3{font-size:15px}
    .modal-close{font-size:22px;line-height:1;color:var(--muted);width:30px;height:30px;border-radius:8px}
    .modal-close:hover{color:var(--text);background:rgba(255,255,255,.06)}
    .modal-body{padding:16px}
    .modal-form{display:grid;gap:12px}
    .modal-form label{display:grid;gap:6px;font-size:12px;color:#c6d5e2}
    .form-readonly{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#0a141f;font-size:13px;color:var(--muted);word-break:break-all}
    .check{display:flex;align-items:center;gap:8px;font-size:13px;color:#c6d5e2}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
    .modal-notice{min-height:18px;color:var(--amber);font-size:12px;margin:8px 0 0}
    @media(max-width:760px){.admin-layout{display:block}.admin-nav{position:static;height:auto;margin-bottom:12px}.admin-nav-list{display:flex;overflow:auto;margin-top:12px}.admin-nav-item{min-width:max-content}.admin-nav-foot{display:none}.header-actions .btn{flex:1}.duration-group{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr}.row-right{align-items:flex-start;text-align:left}.row-actions{justify-content:flex-start}.security-form{flex-direction:column}.stats{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell admin-layout">
    <aside class="admin-nav">
      <div class="admin-nav-title"><div class="admin-nav-mark">AI</div><div><div class="eyebrow">Control room</div><b>管理中心</b></div></div>
      <nav class="admin-nav-list">
        <button class="admin-nav-item active" data-view="users" type="button">▦ <span>用户管理</span></button>
        <button class="admin-nav-item" data-view="codes" type="button">⌁ <span>激活码管理</span></button>
        <button class="admin-nav-item" data-view="update" type="button">↻ <span>赛事更新</span></button>
        <button class="admin-nav-item" data-view="security" type="button">⚙ <span>安全设置</span></button>
      </nav>
      <div class="admin-nav-foot">AI Football<br>管理员工作台</div>
    </aside>
    <div class="admin-content">
      <header class="topbar">
        <div class="brand"><div class="mark">AI</div><div><div class="eyebrow">Operations center</div><h1>管理后台</h1><p class="sub">用户授权、激活码与赛事更新</p></div></div>
        <div class="header-actions"><button class="btn" id="refreshBtn" type="button">刷新数据</button><button class="btn" id="backBtn" type="button">返回首页</button></div>
      </header>
      <section class="main">
        <div class="stats">
          <div class="stat"><span>用户</span><b id="userCount">--</b></div>
          <div class="stat"><span>可用账号</span><b id="activeCount">--</b></div>
          <div class="stat"><span>可兑换激活码</span><b id="codeCount">--</b></div>
        </div>
        <div id="panel" style="display:none">
          <p class="notice" id="notice"></p>
          <div class="workspace" id="workspace">
            <section class="card" id="userCard">
              <div class="card-head"><div><h3>用户管理</h3><p class="hint">添加用户、编辑授权期限、启用或停用账号。</p></div><button class="btn primary" id="addUserBtn" type="button">+ 添加用户</button></div>
              <div class="filters"><input class="field" id="userSearch" type="search" placeholder="搜索邮箱、ID 或授权状态"></div>
              <div class="list" id="userList"></div>
            </section>
            <section class="card hidden" id="codeCard">
              <div class="card-head"><div><h3>激活码管理</h3><p class="hint">生成并复制激活码，未兑换的可随时删除。</p></div></div>
              <div class="code-gen">
                <div class="code-gen-head"><div class="code-gen-mark">⌁</div><div><h3>生成激活码</h3><p class="hint">选择授权期限后生成，默认 72 小时内可兑换。</p></div></div>
                <div class="form-label">授权期限</div>
                <div id="codeDuration"></div>
                <div class="code-gen-actions"><button class="btn primary" id="codeBtn" type="button">生成新激活码</button></div>
                <div class="code-result hidden" id="codeResult"><div class="hint">新激活码已生成</div><div class="code-value" id="codeValue"></div><div class="code-gen-actions" style="margin-top:12px"><button class="btn" id="copyCodeBtn" type="button">复制激活码</button></div></div>
              </div>
              <div class="filters"><input class="field" id="codeSearch" type="search" placeholder="搜索激活码或尾号"></div>
              <div class="list" id="codeList"></div>
            </section>
            <section class="card hidden" id="quickCard">
              <div class="card-head"><div><h3>赛事数据</h3><p class="hint">更新在后台运行，可安全留在本页查看结果。</p></div></div>
              <div class="quick-actions"><button class="btn primary" id="updateBtn" type="button">立即更新赛事数据</button><button class="btn" id="importBtn" type="button">从 JSON 导入数据库</button></div>
              <div class="update-status" id="updateStatus"><b>尚未查询更新状态</b><small>点击更新后将显示抓取、数据库同步或失败原因。</small></div>
            </section>
          </div>
          <section class="card hidden" id="securityCard">
            <div class="card-head"><div><h3>安全设置</h3><p class="hint">重置密码会使所有管理员会话失效。</p></div></div>
            <form class="security-form" id="passwordForm"><input class="field" id="newPassword" type="password" minlength="8" autocomplete="new-password" placeholder="新的管理员密码" required><button class="btn" type="submit">重置密码</button><button class="btn danger" id="logoutBtn" type="button">退出登录</button></form>
          </section>
        </div>
      </section>
    </div>
  </main>
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="modal-close" data-modal-close type="button">×</button></div>
      <div class="modal-body"><div id="modalBody"></div><p class="modal-notice" id="modalNotice"></p></div>
    </div>
  </div>
  <script>
    const state={authToken:localStorage.getItem('football_ai_session')||'',adminToken:localStorage.getItem('football_ai_admin_session')||'',csrfToken:'',users:[],codes:[],view:'users',updateTimer:null};
    const $=id=>document.getElementById(id),escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),formatDate=v=>v?new Date(v).toLocaleString('zh-CN',{hour12:false}):'--';
    const matches=(x,q)=>!q||Object.values(x).some(v=>String(v??'').toLowerCase().includes(q));
    const emptyHTML=text=>`<div class="empty"><svg class="empty-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg><b>${text}</b><small>可调整搜索关键词后重试</small></div>`;

    async function csrf(){const r=await fetch('/api/auth/csrf',{credentials:'same-origin',cache:'no-store'});state.csrfToken=(await r.json()).csrf_token||''}
    async function request(path,options={},token=''){const headers={'Content-Type':'application/json'};if(['POST','PATCH','DELETE'].includes(options.method))headers['X-CSRF-Token']=state.csrfToken;const call=t=>fetch('/api'+path,{...options,credentials:'same-origin',cache:'no-store',headers:{...headers,...(t?{Authorization:'Bearer '+t}:{})}});let r=await call(token||state.adminToken||state.authToken);if(!r.ok&&state.adminToken&&state.authToken&&[401,403].includes(r.status))r=await call(state.authToken);const data=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(data.detail||`请求失败（HTTP ${r.status}）`);e.status=r.status;throw e}return data}
    function setNotice(text=''){$('notice').textContent=text}

    function durationPickerHTML(selected,options){
      const all=[['month','一个月','30 天'],['half_year','半年','180 天'],['year','一年','365 天'],['permanent','永久','不限期'],['expired','立即到期','停用授权'],['','保持不变','不调整']];
      const allow=new Set(options||['month','half_year','year','permanent']);
      const items=all.filter(([v])=>allow.has(v));
      return `<div class="duration-group" data-duration>${items.map(([v,b,s])=>`<button type="button" class="duration-opt${v===selected?' active':''}" data-value="${v}"><b>${b}</b><small>${s}</small></button>`).join('')}</div>`;
    }
    function bindDurationPicker(scope){const g=scope.querySelector('[data-duration]');if(g)g.onclick=e=>{const b=e.target.closest('.duration-opt');if(!b)return;g.querySelectorAll('.duration-opt').forEach(x=>x.classList.toggle('active',x===b))};}
    function pickerValue(scope){const a=scope.querySelector('.duration-opt.active');return a?a.dataset.value:''}

    function openModal(title,bodyHTML){$('modalTitle').textContent=title;$('modalBody').innerHTML=bodyHTML;$('modalNotice').textContent='';$('modalOverlay').classList.remove('hidden')}
    function closeModal(){$('modalOverlay').classList.add('hidden');$('modalBody').innerHTML='';$('modalNotice').textContent=''}

    function openAddUser(){
      openModal('添加用户',`<form class="modal-form" id="userForm"><label>邮箱<input class="field" id="fEmail" type="email" autocomplete="email" required></label><label>密码<input class="field" id="fPassword" type="password" minlength="8" autocomplete="new-password" placeholder="至少 8 位" required></label><div class="form-label">授权期限</div>${durationPickerHTML('month')}<div class="modal-actions"><button class="btn" type="button" data-modal-close>取消</button><button class="btn primary" type="submit">添加</button></div></form>`);
      bindDurationPicker($('modalBody'));
      $('userForm').onsubmit=async e=>{e.preventDefault();try{await request('/admin/users',{method:'POST',body:JSON.stringify({email:$('fEmail').value,password:$('fPassword').value,duration:pickerValue($('modalBody'))})});closeModal();setNotice('用户已添加');await load()}catch(err){$('modalNotice').textContent=err.message}};
    }
    function openEditUser(id){
      const u=state.users.find(x=>x.id===id);if(!u)return;
      openModal('编辑用户',`<form class="modal-form" id="userForm"><div class="form-label">邮箱</div><div class="form-readonly">${escapeHtml(u.email)}</div><label>新密码（留空则不修改）<input class="field" id="fPassword" type="password" minlength="8" autocomplete="new-password" placeholder="留空不修改"></label><div class="form-label">授权期限</div>${durationPickerHTML('',['month','half_year','year','permanent','expired',''])}<label class="check"><input type="checkbox" id="fActive" ${u.is_active?'checked':''}> 账号启用</label><div class="modal-actions"><button class="btn" type="button" data-modal-close>取消</button><button class="btn primary" type="submit">保存</button></div></form>`);
      bindDurationPicker($('modalBody'));
      $('userForm').onsubmit=async e=>{e.preventDefault();const body={};const pwd=$('fPassword').value;if(pwd)body.password=pwd;const dur=pickerValue($('modalBody'));if(dur)body.duration=dur;body.is_active=$('fActive').checked;try{await request(`/admin/users/${id}`,{method:'PATCH',body:JSON.stringify(body)});closeModal();setNotice('用户已更新');await load()}catch(err){$('modalNotice').textContent=err.message}};
    }

    function renderUser(u){
      const active=u.is_active,access=u.is_admin?'管理员':active?'可用':'已停用',expiry=u.activation_expires_at?formatDate(u.activation_expires_at):'永久';
      return `<article class="row user-row"><div class="user-info"><b>${escapeHtml(u.email)}</b><small>ID ${u.id} · ${u.bet_count} 条记录 · 注册于 ${formatDate(u.created_at)} · 授权至 ${expiry}</small></div><div class="row-right"><span class="tag ${u.is_admin||active?'ok':'red'}">${access}</span>${u.is_admin?'<small>受保护</small>':`<div class="row-actions"><button class="btn" data-edit="${u.id}" type="button">编辑</button><button class="btn" data-user="${u.id}" data-active="${!active}" type="button">${active?'停用':'启用'}</button><button class="btn danger" data-user-delete="${u.id}" type="button">删除</button></div>`}</div></article>`;
    }
    function renderCode(c){
      const expired=new Date(c.expires_at)<new Date(),status=c.used_at?`已使用（用户 ${c.used_by}）`:expired?'已过期':'待兑换',cls=c.used_at?'used':' '+(expired?'red':'ok'),code=c.code||'',display=code||c.code_hint;
      return `<article class="row code-row"><div class="code-mark">⌁</div><div class="code-info"><b>${escapeHtml(display)}</b><small>${escapeHtml(c.duration)}授权 · 兑换截止 ${formatDate(c.expires_at)}<br>创建于 ${formatDate(c.created_at)}</small></div><div class="row-right"><span class="tag${cls}">${status}</span><div class="row-actions">${code?`<button class="btn" data-copy="${code}" type="button">复制</button>`:''}<button class="btn danger" data-code-delete="${c.id}" type="button">删除</button></div></div></article>`;
    }
    function render(){if(state.view==='users')renderUserList();else if(state.view==='codes')renderCodeList()}
    function renderUserList(){const q=$('userSearch').value.trim().toLowerCase();const items=state.users.filter(u=>matches(u,q));$('userList').innerHTML=items.length?items.map(renderUser).join(''):emptyHTML('没有找到匹配用户')}
    function renderCodeList(){const q=$('codeSearch').value.trim().toLowerCase();const items=state.codes.filter(c=>matches(c,q));$('codeList').innerHTML=items.length?items.map(renderCode).join(''):emptyHTML('没有找到匹配激活码')}

    async function load(){try{const [users,codes,status]=await Promise.all([request('/admin/users'),request('/admin/activation-codes'),request('/admin/update-data/status')]);state.users=users.items;state.codes=codes.items;$('userCount').textContent=users.items.length;$('activeCount').textContent=users.items.filter(x=>x.is_active).length;$('codeCount').textContent=codes.items.filter(x=>!x.used_at&&new Date(x.expires_at)>=new Date()).length;render();showUpdateStatus(status)}catch(e){if([401,403].includes(e.status)){localStorage.removeItem('football_ai_admin_session');localStorage.removeItem('football_ai_session');location.href='/login.html?role=admin'}else setNotice(e.message)}}

    function showUpdateStatus(s){$('updateStatus').innerHTML=`<b>${escapeHtml(s.message||'暂无更新任务')}</b><small>${s.running?'更新任务正在后台运行，请耐心等待。':(s.output||'最近一次任务尚无详细输出')}</small>`;$('updateBtn').disabled=Boolean(s.running);if(s.running)watchUpdate()}
    function watchUpdate(){clearTimeout(state.updateTimer);state.updateTimer=setTimeout(async()=>{try{const s=await request('/admin/update-data/status');showUpdateStatus(s);if(!s.running)await load()}catch(e){setNotice(e.message)}},2500)}

    function setAdminView(view){
      state.view=view;
      $('userCard').classList.toggle('hidden',view!=='users');
      $('codeCard').classList.toggle('hidden',view!=='codes');
      $('quickCard').classList.toggle('hidden',view!=='update');
      $('workspace').classList.toggle('hidden',view==='security');
      $('securityCard').classList.toggle('hidden',view!=='security');
      document.querySelectorAll('.admin-nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
      render();
    }

    async function logout(){clearTimeout(state.updateTimer);try{await request('/auth/logout',{method:'POST',body:'{}'})}catch(e){}localStorage.removeItem('football_ai_admin_session');localStorage.removeItem('football_ai_session');location.href='/login.html'}
    async function init(){await csrf();$('codeDuration').innerHTML=durationPickerHTML('month');bindDurationPicker($('codeDuration'));await load();$('panel').style.display=''}

    $('backBtn').onclick=()=>location.href='/';$('refreshBtn').onclick=load;
    $('userSearch').oninput=render;$('codeSearch').oninput=render;
    $('addUserBtn').onclick=openAddUser;
    document.querySelectorAll('.admin-nav-item').forEach(b=>b.addEventListener('click',()=>setAdminView(b.dataset.view)));
    $('codeBtn').onclick=async()=>{try{const p=await request('/admin/activation-codes',{method:'POST',body:JSON.stringify({expires_hours:72,duration:pickerValue($('codeDuration'))})});$('codeValue').textContent=p.code;$('codeResult').classList.remove('hidden');setNotice('激活码已生成，请复制后妥善保存。');await load()}catch(e){setNotice(e.message)}};
    $('copyCodeBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('codeValue').textContent);setNotice('激活码已复制')}catch(e){setNotice('复制失败，请手动复制')}};
    $('updateBtn').onclick=async()=>{try{const p=await request('/admin/update-data',{method:'POST',body:'{}'});setNotice(p.message);showUpdateStatus({running:true,message:p.message,output:''})}catch(e){setNotice(e.message)}};
    $('importBtn').onclick=async()=>{const b=$('importBtn');b.disabled=true;try{const p=await request('/admin/import-data',{method:'POST',body:'{}'});setNotice(`${p.message}：${Object.entries(p.results).map(([k,v])=>`${k}=${v}`).join('，')}`);await load()}catch(e){setNotice(e.message)}finally{b.disabled=false}};
    $('passwordForm').onsubmit=async e=>{e.preventDefault();try{const p=await request('/admin/password',{method:'POST',body:JSON.stringify({new_password:$('newPassword').value})});alert(p.message);logout()}catch(err){setNotice(err.message)}};
    $('logoutBtn').onclick=logout;
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('modalOverlay').classList.contains('hidden'))closeModal()});
    document.addEventListener('click',async e=>{
      const copy=e.target.closest('[data-copy]');if(copy){try{await navigator.clipboard.writeText(copy.dataset.copy);setNotice('已复制：'+copy.dataset.copy)}catch(err){setNotice('复制失败，请手动复制')}return}
      const edit=e.target.closest('[data-edit]');if(edit){openEditUser(Number(edit.dataset.edit));return}
      const toggle=e.target.closest('[data-user]');if(toggle){const active=toggle.dataset.active==='true',action=active?'启用':'停用';if(!confirm(`确定${action}该账号吗？`))return;try{await request(`/admin/users/${toggle.dataset.user}`,{method:'PATCH',body:JSON.stringify({is_active:active})});setNotice(`账号已${action}`);await load()}catch(err){setNotice(err.message)}return}
      const delUser=e.target.closest('[data-user-delete]');if(delUser){if(!confirm('删除用户会同时删除其下注记录，确定继续吗？'))return;try{await request(`/admin/users/${delUser.dataset.userDelete}`,{method:'DELETE'});setNotice('用户已删除');await load()}catch(err){setNotice(err.message)}return}
      const delCode=e.target.closest('[data-code-delete]');if(delCode){if(!confirm('确定删除这个激活码吗？'))return;try{await request(`/admin/activation-codes/${delCode.dataset.codeDelete}`,{method:'DELETE'});setNotice('激活码已删除');await load()}catch(err){setNotice(err.message)}return}
      if(e.target.closest('[data-modal-close]')){closeModal();return}
      if(e.target.id==='modalOverlay')closeModal();
    });
    init();
  </script>
</body>
</html>
