services:
  app:
    image: ghcr.io/e5sub/ai-football:latest
    container_name: ai-football
    network_mode: host
    environment:
      - DATABASE_URL=mysql+pymysql://football:football@127.0.0.1:3306/football?charset=utf8mb4
      - SESSION_DAYS=365
      - PUBLIC_BASE_URL=http://localhost:8000
      - PASSWORD_RESET_MINUTES=30
      - PASSWORD_RESET_COOLDOWN_SECONDS=60
      - TZ=Asia/Shanghai
      - AUTH_SECRET_KEY=123456789（自己修改）
      - COOKIE_SECURE=1
      - DATA_UPDATE_TIMES=00:15,02:15,04:15,08:15,14:15,18:15,22:15
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASSWORD=
      - SMTP_FROM=
      - SMTP_USE_TLS=1
      - SMTP_USE_SSL=0
      - SMTP_TIMEOUT=20
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped