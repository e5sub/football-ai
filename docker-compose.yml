services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/your-org/ai-football:latest}
    container_name: football-ai
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: ${DATABASE_URL:?请在 .env 中配置外部 MySQL DATABASE_URL}
      SESSION_DAYS: ${SESSION_DAYS:-365}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      DATA_UPDATE_INTERVAL_HOURS: ${DATA_UPDATE_INTERVAL_HOURS:-2}
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
